<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>💳 생활비 관리</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #FEFCE8;
      --yellow-100: #FEF9C3;
      --yellow-200: #FEF08A;
      --yellow-300: #FDE047;
      --blue-50:    #EFF6FF;
      --blue-100:   #DBEAFE;
      --blue-200:   #BFDBFE;
      --blue-300:   #93C5FD;
      --blue-400:   #60A5FA;
      --blue-500:   #3B82F6;
      --blue-600:   #2563EB;
      --text-dark:  #1E3A5F;
      --text-mid:   #374151;
      --text-muted: #9CA3AF;
      --white:      #FFFFFF;
      --border:     #E5E7EB;
      --green:      #10B981;
      --red:        #EF4444;
      --shadow-sm:  0 1px 6px rgba(59,130,246,0.08);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    }

    body { font-family: var(--font); background: var(--bg); color: var(--text-mid); min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: 76px; transition: background 0.3s; }

    /* ── HEADER ─── */
    .header { background: linear-gradient(135deg, var(--blue-400), var(--blue-600)); color: #fff; padding: 14px 20px 18px; position: sticky; top: 0; z-index: 100; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.05rem; font-weight: 800; }
    .sync-badge {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.72rem; font-weight: 700;
      background: rgba(255,255,255,0.18); border-radius: 20px;
      padding: 4px 10px; cursor: pointer; transition: background 0.2s;
      border: none; color: #fff;
    }
    .sync-badge:hover { background: rgba(255,255,255,0.28); }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; flex-shrink: 0; }
    .sync-dot.green  { background: #6EE7B7; }
    .sync-dot.yellow { background: #FDE047; animation: pulse 1s infinite; }
    .sync-dot.red    { background: #FCA5A5; }
    .sync-dot.grey   { background: rgba(255,255,255,0.45); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .month-nav { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .month-btn { background: rgba(255,255,255,0.22); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
    .month-label { font-size: 1rem; font-weight: 700; }

    /* ── NAV ─── */
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #fff; border-top: 1px solid var(--border); display: flex; z-index: 200; box-shadow: 0 -3px 12px rgba(0,0,0,0.07); }
    .nav-btn { flex: 1; padding: 9px 4px 7px; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-muted); font-size: 0.62rem; font-weight: 600; transition: color 0.2s; }
    .nav-btn.active { color: var(--blue-500); }
    .nav-btn svg { width: 21px; height: 21px; }

    /* ── PAGES ─── */
    .page { display: none; padding: 14px 14px 4px; }
    .page.active { display: block; }

    /* ── LOADING OVERLAY ─── */
    .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.85); z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    .loading-overlay.hidden { display: none; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--blue-100); border-top-color: var(--blue-500); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.9rem; font-weight: 700; color: var(--text-dark); }

    /* ── CARDS ─── */
    .card { background: #fff; border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
    .section-title { font-size: 0.9rem; font-weight: 800; color: var(--text-dark); margin: 14px 0 8px; }

    /* ── SUMMARY ─── */
    .summary-card { background: linear-gradient(135deg, var(--yellow-100), var(--yellow-200)); border-radius: 20px; padding: 18px 20px 16px; margin-bottom: 14px; box-shadow: 0 4px 18px rgba(250,204,21,0.25); }
    .summary-label { font-size: 0.72rem; color: #92400E; font-weight: 600; }
    .summary-amount { font-size: 2rem; font-weight: 900; color: #78350F; margin: 2px 0 10px; line-height: 1; }
    .summary-row { display: flex; gap: 8px; }
    .summary-mini { flex: 1; background: rgba(255,255,255,0.55); border-radius: 12px; padding: 9px 10px; text-align: center; }
    .mini-label { font-size: 0.65rem; color: #92400E; font-weight: 600; }
    .mini-val   { font-size: 0.88rem; font-weight: 800; color: #78350F; margin-top: 2px; }

    /* ── CARD ITEM ─── */
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-name { font-weight: 800; font-size: 0.95rem; color: var(--text-dark); }
    .badge { font-size: 0.62rem; padding: 3px 9px; border-radius: 20px; font-weight: 700; }
    .badge-debit  { background: var(--blue-100); color: var(--blue-600); }
    .badge-credit { background: var(--yellow-100); color: #B45309; }
    .amounts-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .amt-sub { font-size: 0.68rem; color: var(--text-muted); margin-bottom: 2px; }
    .amt-val { font-size: 1.05rem; font-weight: 800; color: var(--text-dark); }
    .amt-val.green { color: var(--green); }
    .amt-val.red   { color: var(--red); }
    .prog-bar  { height: 8px; background: var(--blue-100); border-radius: 6px; overflow: hidden; margin-bottom: 3px; }
    .prog-fill { height: 100%; border-radius: 6px; transition: width 0.6s ease; background: linear-gradient(90deg, var(--blue-300), var(--blue-500)); }
    .prog-fill.warn { background: linear-gradient(90deg, #FDE68A, #FBBF24); }
    .prog-fill.over { background: linear-gradient(90deg, #FCA5A5, var(--red)); }
    .prog-pct { font-size: 0.68rem; color: var(--text-muted); text-align: right; }
    .inst-note { margin-top: 9px; padding: 8px 11px; background: var(--yellow-100); border-radius: 10px; font-size: 0.74rem; color: #92400E; line-height: 1.5; }

    /* ── FORM ─── */
    .form-group { margin-bottom: 13px; }
    .form-label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-dark); margin-bottom: 5px; }
    .form-control { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 0.95rem; color: var(--text-mid); background: #fff; transition: border-color 0.2s; -webkit-appearance: none; appearance: none; font-family: var(--font); }
    .form-control:focus { outline: none; border-color: var(--blue-300); }
    .form-control::placeholder { color: var(--text-muted); }

    /* ── QUICK AMOUNTS ─── */
    .quick-amounts { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
    .qa-btn { flex: 1; min-width: 44px; padding: 7px 3px; background: var(--blue-50); border: 1.5px solid var(--blue-200); border-radius: 9px; font-size: 0.74rem; font-weight: 800; color: var(--blue-600); cursor: pointer; transition: all 0.15s; text-align: center; }
    .qa-btn:active { background: var(--blue-100); transform: scale(0.95); }
    .qa-clear { background: #FFF7ED; border-color: #FED7AA; color: #C2410C; }

    /* ── PRESETS ─── */
    .preset-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
    .preset-chip { padding: 6px 13px; background: var(--yellow-100); border: 1.5px solid var(--yellow-200); border-radius: 20px; font-size: 0.78rem; font-weight: 700; color: #92400E; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .preset-chip:active { background: var(--yellow-200); transform: scale(0.96); }

    /* ── TOGGLE ─── */
    .toggle-row { display: flex; gap: 8px; }
    .toggle-btn { flex: 1; padding: 11px; border: 1.5px solid var(--border); border-radius: 11px; background: #fff; cursor: pointer; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); transition: all 0.2s; }
    .toggle-btn.on { border-color: var(--blue-500); background: var(--blue-50); color: var(--blue-600); }

    /* ── BUTTONS ─── */
    .btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 0.97rem; font-weight: 800; cursor: pointer; transition: transform 0.1s; font-family: var(--font); }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(135deg, var(--blue-400), var(--blue-600)); color: #fff; box-shadow: 0 4px 14px rgba(59,130,246,0.3); }
    .btn-yellow  { background: var(--yellow-200); color: #78350F; font-weight: 800; }
    .btn-red     { background: #FEE2E2; color: var(--red); }
    .btn-sm      { width: auto; padding: 5px 13px; font-size: 0.75rem; border-radius: 8px; }
    .btn-ghost   { background: var(--blue-50); color: var(--blue-600); }

    /* ── HISTORY ─── */
    .view-toggle { display: flex; background: var(--blue-50); border-radius: 13px; padding: 3px; margin-bottom: 12px; }
    .view-btn { flex: 1; padding: 9px; border: none; background: none; border-radius: 10px; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
    .view-btn.on { background: #fff; color: var(--blue-600); box-shadow: 0 1px 5px rgba(0,0,0,0.1); }
    .filter-bar { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip { padding: 6px 14px; border: 1.5px solid var(--border); border-radius: 20px; background: #fff; font-size: 0.78rem; font-weight: 700; cursor: pointer; white-space: nowrap; color: var(--text-muted); transition: all 0.15s; }
    .chip.on { border-color: var(--blue-500); background: var(--blue-100); color: var(--blue-600); }
    .expense-row { display: flex; align-items: center; background: #fff; border-radius: 13px; padding: 11px 12px; margin-bottom: 7px; box-shadow: var(--shadow-sm); }
    .exp-icon  { width: 38px; height: 38px; border-radius: 10px; background: var(--blue-50); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; margin-right: 11px; }
    .exp-info  { flex: 1; min-width: 0; }
    .exp-desc  { font-weight: 700; font-size: 0.88rem; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .exp-meta  { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .exp-right { text-align: right; flex-shrink: 0; margin-left: 8px; }
    .exp-amount { font-weight: 800; font-size: 0.92rem; color: var(--text-dark); }
    .del-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.15rem; margin-left: 4px; line-height: 1; flex-shrink: 0; }
    .del-btn:hover { color: var(--red); }
    .income-row { border-left: 3px solid #10B981; }
    .inc-amount { color: #10B981 !important; font-weight: 800; }
    .inc-badge { display: inline-block; background: #D1FAE5; color: #065F46; font-size: 0.62rem; font-weight: 700; padding: 1px 6px; border-radius: 8px; margin-left: 5px; vertical-align: middle; }
    .edit-exp-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.95rem; margin-left: 4px; line-height: 1; flex-shrink: 0; }
    .edit-exp-btn:hover { color: var(--blue-500); }
    .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1E3A5F; color: #fff; padding: 10px 22px; border-radius: 22px; font-size: 0.84rem; font-weight: 700; opacity: 0; transition: all 0.28s; z-index: 999; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── CALENDAR ─── */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow { text-align: center; font-size: 0.68rem; font-weight: 700; color: var(--text-muted); padding: 6px 0 4px; }
    .cal-dow.sun { color: #EF4444; }
    .cal-dow.sat { color: var(--blue-500); }
    .cal-day { border-radius: 10px; padding: 5px 3px 5px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.12s; min-height: 56px; }
    .cal-day:active { transform: scale(0.92); }
    .cal-day.empty  { background: transparent !important; cursor: default; }
    .cal-day.today  { box-shadow: 0 0 0 2px var(--blue-400); }
    .cal-day.selected { box-shadow: 0 0 0 2.5px #F59E0B; }
    .day-num { font-size: 0.78rem; font-weight: 800; color: var(--text-dark); line-height: 1; }
    .day-num.sun { color: #EF4444; }
    .day-num.sat { color: var(--blue-500); }
    .day-amt  { font-size: 0.6rem; font-weight: 800; margin-top: 4px; text-align: center; line-height: 1.3; }
    .day-sum  { font-size: 0.5rem; opacity: 0.7; margin-top: 1px; }
    .cal-day.lv0 { background: #F3F4F6; }
    .cal-day.lv1 { background: #DBEAFE; }
    .cal-day.lv1 .day-amt { color: var(--blue-600); }
    .cal-day.lv2 { background: #93C5FD; }
    .cal-day.lv2 .day-num { color: #1E3A5F; }
    .cal-day.lv2 .day-num.sun { color: #DC2626; }
    .cal-day.lv2 .day-num.sat { color: #1D4ED8; }
    .cal-day.lv2 .day-amt { color: #1E3A5F; }
    .cal-day.lv3 { background: var(--blue-500); }
    .cal-day.lv3 .day-num,
    .cal-day.lv3 .day-num.sun,
    .cal-day.lv3 .day-num.sat { color: #fff; }
    .cal-day.lv3 .day-amt { color: #BFDBFE; }
    .cal-legend { display: flex; align-items: center; gap: 6px; margin: 8px 0 14px; font-size: 0.68rem; color: var(--text-muted); }
    .cal-legend-dots { display: flex; gap: 3px; }
    .cal-legend-dot  { width: 13px; height: 13px; border-radius: 4px; }
    .day-detail-header { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 8px; }
    .day-detail-title { font-size: 0.9rem; font-weight: 800; color: var(--text-dark); }
    .day-detail-total { font-size: 0.9rem; font-weight: 800; color: var(--blue-600); }

    /* ── INSTALLMENTS ─── */
    .inst-card { background: #fff; border-radius: 16px; padding: 14px 15px; margin-bottom: 10px; box-shadow: var(--shadow-sm); }
    .inst-top  { display: flex; justify-content: space-between; align-items: flex-start; }
    .inst-name { font-weight: 800; font-size: 0.92rem; color: var(--text-dark); }
    .inst-badge { font-size: 0.62rem; background: var(--yellow-100); color: #B45309; padding: 2px 8px; border-radius: 10px; font-weight: 700; margin-top: 3px; display: inline-block; }
    .inst-monthly { font-size: 1rem; font-weight: 900; color: var(--blue-600); text-align: right; }
    .inst-monthly span { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); }
    .inst-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin: 8px 0 5px; }
    .inst-prog-bar  { height: 6px; background: var(--yellow-100); border-radius: 4px; overflow: hidden; }
    .inst-prog-fill { height: 100%; background: linear-gradient(90deg, var(--yellow-200), var(--yellow-300)); border-radius: 4px; }
    .inst-status-done { opacity: 0.5; }

    /* ── SETTINGS ─── */
    .setting-card { background: #fff; border-radius: 18px; overflow: hidden; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
    .setting-card-head { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; background: var(--blue-50); }
    .setting-card-head h3 { font-size: 0.88rem; font-weight: 800; color: var(--blue-600); }
    .edit-btn { padding: 5px 13px; background: var(--blue-500); color: #fff; border: none; border-radius: 8px; font-size: 0.73rem; font-weight: 700; cursor: pointer; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 16px; border-top: 1px solid var(--border); }
    .setting-lbl { font-size: 0.82rem; color: var(--text-muted); }
    .setting-val { font-size: 0.88rem; font-weight: 700; color: var(--text-dark); }

    /* ── SYNC SETUP SECTION ─── */
    .sync-setup { background: #fff; border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
    .sync-setup h3 { font-size: 0.88rem; font-weight: 800; color: var(--blue-600); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .sync-status-card { border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 0.82rem; font-weight: 600; }
    .sync-status-card.connected    { background: #D1FAE5; color: #065F46; }
    .sync-status-card.disconnected { background: var(--yellow-100); color: #92400E; }
    .sync-status-card.error        { background: #FEE2E2; color: #991B1B; }

    .step-list { list-style: none; counter-reset: steps; margin-bottom: 14px; }
    .step-list li { counter-increment: steps; display: flex; gap: 10px; margin-bottom: 12px; font-size: 0.82rem; color: var(--text-mid); line-height: 1.5; }
    .step-list li::before { content: counter(steps); background: var(--blue-500); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 800; flex-shrink: 0; margin-top: 1px; }
    .step-list li b { color: var(--text-dark); }
    .step-list li a { color: var(--blue-600); text-decoration: none; font-weight: 700; }

    .code-block { background: #1E293B; color: #E2E8F0; border-radius: 10px; padding: 12px 14px; font-family: 'Courier New', monospace; font-size: 0.72rem; line-height: 1.6; margin: 8px 0; overflow-x: auto; white-space: pre; }
    .copy-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 10px; background: #1E293B; color: #94A3B8; border: none; border-radius: 10px; font-size: 0.78rem; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
    .copy-btn:hover { background: #0F172A; color: #E2E8F0; }
    .copy-btn.copied { background: #065F46; color: #D1FAE5; }

    .url-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .url-row input { flex: 1; font-size: 0.78rem; padding: 10px 12px; }
    .url-row .btn { width: auto; padding: 10px 14px; font-size: 0.78rem; }

    .sync-actions { display: flex; gap: 8px; }
    .sync-actions .btn { font-size: 0.82rem; padding: 11px; }

    /* ── THEME ─── */
    .theme-section { background: #fff; border-radius: 18px; padding: 15px 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
    .theme-section h3 { font-size: 0.88rem; font-weight: 800; color: var(--blue-600); margin-bottom: 12px; }
    .theme-label { font-size: 0.78rem; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
    .color-swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .swatch { width: 38px; height: 38px; border-radius: 10px; cursor: pointer; border: 2.5px solid transparent; transition: all 0.15s; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
    .swatch.on { border-color: var(--blue-500); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--blue-500); }
    .font-options { display: flex; gap: 8px; }
    .font-opt { flex: 1; padding: 10px 6px; border: 1.5px solid var(--border); border-radius: 10px; background: #fff; cursor: pointer; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-align: center; transition: all 0.2s; }
    .font-opt.on { border-color: var(--blue-500); background: var(--blue-50); color: var(--blue-600); }

    /* ── PRESET SETTINGS ─── */
    .preset-setting-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
    .preset-edit-chip { display: flex; align-items: center; gap: 4px; padding: 6px 10px 6px 13px; background: var(--yellow-100); border: 1.5px solid var(--yellow-200); border-radius: 20px; font-size: 0.78rem; font-weight: 700; color: #92400E; }
    .preset-edit-chip button { background: none; border: none; cursor: pointer; color: #B45309; font-size: 0.85rem; line-height: 1; padding: 0; }
    .preset-add-row { display: flex; gap: 8px; }
    .preset-add-row input { flex: 1; }
    .preset-add-row .btn { width: auto; padding: 10px 16px; font-size: 0.82rem; }

    /* ── MODAL ─── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.38); z-index: 300; align-items: flex-end; justify-content: center; }
    .overlay.open { display: flex; }
    .sheet { background: #fff; border-radius: 24px 24px 0 0; padding: 8px 20px 44px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; position: relative; }
    .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 10px auto 14px; }
    .sheet-title  { font-size: 1.05rem; font-weight: 800; color: var(--text-dark); margin-bottom: 16px; text-align: center; }
    .sheet-close  { position: absolute; top: 16px; right: 18px; background: var(--blue-50); border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 1rem; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }

    .empty { text-align: center; padding: 48px 20px; color: var(--text-muted); }

<script>
// ══════════════════════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════════════════════
const KEY     = 'cashbook_v5';
const GAS_KEY = 'cashbook_gas_url';
const GAS_SEC = 'cashbook_gas_secret';

function getSecretKey() { return localStorage.getItem(GAS_SEC) || ''; }

function load() {
  try { return ensureFields(JSON.parse(localStorage.getItem(KEY))) || defaults(); }
  catch { return defaults(); }
}
function saveLocal(d) { localStorage.setItem(KEY, JSON.stringify(d)); }

function defaults() {
  return {
    cards: [
      { id: 'c1', name: '체크카드 1', type: 'debit',  budget: 500000 },
      { id: 'c2', name: '체크카드 2', type: 'debit',  budget: 400000 },
      { id: 'c3', name: '신용카드',   type: 'credit', budget: 600000 }
    ],
    installments: [],
    presets: ['식비', '교통비', '마트', '카페', '편의점', '의료비', '쇼핑', '외식'],
    theme: { bg: 'yellow', accent: 'blue', font: 'default' },
    months: {}
  };
}

function ensureFields(d) {
  if (!d) return null;
  if (!d.presets)      d.presets      = ['식비', '교통비', '마트', '카페', '편의점'];
  if (!d.theme)        d.theme        = { bg: 'yellow', accent: 'blue', font: 'default' };
  if (!d.installments) d.installments = [];
  if (!d.months)       d.months       = {};
  // v4 → v5 마이그레이션: 루트의 expenses를 월별로 이동
  if (d.expenses && Array.isArray(d.expenses)) {
    d.expenses.forEach(e => {
      const ym = e.date ? e.date.slice(0, 7) : '';
      if (!ym) return;
      if (!d.months[ym]) d.months[ym] = { expenses: [], incomes: [] };
      if (!d.months[ym].incomes) d.months[ym].incomes = [];
      d.months[ym].expenses.push(e);
    });
    delete d.expenses;
  }
  // 각 월 데이터에 incomes 필드 보장
  Object.keys(d.months).forEach(ym => {
    if (!d.months[ym].incomes) d.months[ym].incomes = [];
    if (!d.months[ym].expenses) d.months[ym].expenses = [];
  });
  return d;
}

function getMonthData(ym) {
  const d = load();
  if (!d.months[ym]) d.months[ym] = { expenses: [], incomes: [] };
  return d.months[ym];
}

function getGasUrl() { return localStorage.getItem(GAS_KEY) || ''; }
function setGasUrl(u) { localStorage.setItem(GAS_KEY, u.trim()); }

// ══════════════════════════════════════════════════════════
//  SYNC (Google Sheets via Apps Script)
// ══════════════════════════════════════════════════════════
let syncState = 'idle'; // idle | loading | syncing | synced | error
let syncTimer = null;

function setSyncState(s) {
  syncState = s;
  const dot  = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  if (!dot) return;
  const map = {
    idle:    { cls: 'grey',   label: '미연동' },
    loading: { cls: 'yellow', label: '불러오는 중…' },
    syncing: { cls: 'yellow', label: '저장 중…' },
    synced:  { cls: 'green',  label: '동기화됨' },
    error:   { cls: 'red',    label: '오류' },
  };
  const m = map[s] || map.idle;
  dot.className  = 'sync-dot ' + m.cls;
  text.textContent = m.label;
}

async function syncLoad(showOverlay = false) {
  const url = getGasUrl();
  const key = getSecretKey();
  if (!url || !key) { setSyncState('idle'); return; }
  if (showOverlay) showLoading('Google Sheets에서 불러오는 중…');
  setSyncState('loading');
  try {
    const res  = await fetch(`${url}?key=${encodeURIComponent(key)}`, { cache: 'no-store' });
    const text = await res.text();
    if (text.includes('"error":"unauthorized"')) {
      setSyncState('error');
      hideLoading();
      alert('❌ 비밀 키가 틀렸어요.\n설정에서 Apps Script의 SECRET_KEY와 동일한 키를 입력했는지 확인해주세요.');
      return;
    }
    const remote = text && text !== '{}' ? JSON.parse(text) : null;
    if (remote && remote.cards && remote.cards.length > 0) {
      saveLocal(remote);
      applyTheme(remote.theme || {});
      renderPage();
    } else if (!remote || remote === '{}') {
      // 시트가 비어있으면 로컬 데이터를 올림
      await syncSaveNow();
    }
    setSyncState('synced');
  } catch(e) {
    console.warn('syncLoad error:', e);
    setSyncState('error');
  } finally {
    hideLoading();
  }
}

async function syncSaveNow() {
  const url = getGasUrl();
  const key = getSecretKey();
  if (!url || !key) return;
  setSyncState('syncing');
  try {
    const data    = JSON.stringify(load());
    const saveUrl = `${url}?key=${encodeURIComponent(key)}&action=write&data=${encodeURIComponent(data)}`;
    const res  = await fetch(saveUrl, { cache: 'no-store' });
    const text = await res.text();
    const json = JSON.parse(text);
    if (json.error) throw new Error(json.error);
    setSyncState('synced');
  } catch(e) {
    console.warn('syncSave error:', e);
    setSyncState('error');
  }
}

function scheduleSave(data) {
  saveLocal(data);
  if (!getGasUrl()) return;
  clearTimeout(syncTimer);
  setSyncState('syncing');
  syncTimer = setTimeout(syncSaveNow, 1200);
}

async function manualSync() {
  const url = getGasUrl();
  if (!url) { alert('설정 → Google Sheets 연동에서 URL을 먼저 입력해주세요.'); go('settings'); return; }
  await syncLoad(true);
  if (PAGE === 'settings') renderSettings();
}

// ══════════════════════════════════════════════════════════
//  LOADING OVERLAY
// ══════════════════════════════════════════════════════════
function showLoading(msg) {
  document.getElementById('loadingText').textContent = msg || '불러오는 중…';
  document.getElementById('loadingOverlay').classList.remove('hidden');
}
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
let CY = new Date().getFullYear();
let CM = new Date().getMonth() + 1;
let PAGE = 'home';
let HIST_FILTER = 'all';
let HIST_VIEW   = 'list';
let SEL_DAY     = null;
let PAY_TYPE    = 'normal';
let ENTRY_TYPE  = 'expense';
let EDIT_CARD_TYPE = 'debit';

// ══════════════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════════════
const won  = n => Number(n).toLocaleString('ko-KR') + '원';
const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const pad  = n => String(n).padStart(2, '0');
const ymNow = () => `${CY}-${pad(CM)}`;
function cardMap() { const m = {}; load().cards.forEach(c => m[c.id] = c); return m; }

// ══════════════════════════════════════════════════════════
//  AMOUNT INPUT
// ══════════════════════════════════════════════════════════
function onAmountInput(el) {
  const raw = el.value.replace(/[^0-9]/g, '');
  el.value  = raw ? parseInt(raw).toLocaleString('ko-KR') : '';
}
function addAmount(n) {
  const el  = document.getElementById('fAmount');
  const cur = parseInt(el.value.replace(/[^0-9]/g, '')) || 0;
  el.value  = (cur + n).toLocaleString('ko-KR');
}
function addAmountTo(id, n) {
  const el  = document.getElementById(id);
  const cur = parseInt(el.value.replace(/[^0-9]/g, '')) || 0;
  el.value  = (cur + n).toLocaleString('ko-KR');
}
function clearAmount() { document.getElementById('fAmount').value = ''; }
function getAmount(id = 'fAmount') {

function changeMonth(d) {
  CM += d; if (CM > 12) { CM = 1; CY++; } if (CM < 1) { CM = 12; CY--; }
  SEL_DAY = null; renderPage();
}

// ══════════════════════════════════════════════════════════
//  SPENDING CALC
// ══════════════════════════════════════════════════════════
function regularSpent(cardId, y, m) {
  const ym = `${y}-${pad(m)}`;
  const d = load();
  const md = d.months[ym];
  if (!md) return 0;
  return (md.expenses || []).filter(e => e.cardId === cardId).reduce((s, e) => s + e.amount, 0);
}
function totalIncome(cardId, y, m) {
  const ym = `${y}-${pad(m)}`;
  const d = load();
  const md = d.months[ym];
  if (!md) return 0;
  return (md.incomes || []).filter(e => !cardId || e.cardId === cardId).reduce((s, e) => s + e.amount, 0);
}
function instMonthly(cardId, y, m) {
  const cur = y * 12 + m;
  return load().installments.filter(i => {
    if (i.cardId !== cardId) return false;
    const [sy, sm] = i.startMonth.split('-').map(Number);
    const start = sy * 12 + sm;
    return cur >= start && cur < start + i.months;
  }).reduce((s, i) => s + i.monthlyAmount, 0);
}
function totalSpent(cardId, y, m) { return regularSpent(cardId, y, m) + instMonthly(cardId, y, m); }

// 모든 월 데이터에서 ID로 항목 검색 (지출/수입 모두)
function findEntryById(id) {
  const d = load();
  for (const ym of Object.keys(d.months)) {
    const md = d.months[ym];
    const exp = (md.expenses || []).find(e => e.id === id);
    if (exp) return { entry: exp, ym, type: 'expense' };
    const inc = (md.incomes || []).find(e => e.id === id);
    if (inc) return { entry: inc, ym, type: 'income' };
  }
  return null;
}

function renderHome() {
  const d = load();
  let totBudget = 0, totSpent = 0, totIncome = 0;
  d.cards.forEach(c => { totBudget += c.budget; totSpent += totalSpent(c.id, CY, CM); totIncome += totalIncome(c.id, CY, CM); });
  const totRemain = totBudget - totSpent;
  const totPct = totBudget ? Math.round(totSpent / totBudget * 100) : 0;

  const totNet = totBudget - totSpent + totIncome;
  const totPct = totBudget ? Math.round(totSpent / totBudget * 100) : 0;

  let html = `
    <div class="summary-card">
      <div class="summary-label">이번 달 총 예산</div>
      <div class="summary-amount">${won(totBudget)}</div>
      <div class="summary-row">
        <div class="summary-mini"><div class="mini-label">지출</div><div class="mini-val">${won(totSpent)}</div></div>
        ${totIncome>0?`<div class="summary-mini"><div class="mini-label" style="color:#10B981">수입</div><div class="mini-val" style="color:#10B981">+${won(totIncome)}</div></div>`:''}
        <div class="summary-mini"><div class="mini-label">잔여</div><div class="mini-val">${won(Math.max(0,totNet))}</div></div>
        <div class="summary-mini"><div class="mini-label">사용률</div><div class="mini-val">${totPct}%</div></div>
      </div>
    </div>
    <div class="section-title">카드별 현황</div>`;

  d.cards.forEach(card => {
    const spent   = totalSpent(card.id, CY, CM);
    const income  = totalIncome(card.id, CY, CM);
    const net     = card.budget - spent + income;
    const pct     = card.budget ? Math.min(100, Math.round(spent / card.budget * 100)) : 0;
    const cls     = pct >= 90 ? 'over' : pct >= 70 ? 'warn' : '';
    const instAmt = instMonthly(card.id, CY, CM);
    const regAmt  = regularSpent(card.id, CY, CM);
    html += `
      <div class="card">
        <div class="card-header">
          <span class="card-name">${card.name}</span>
          <span class="badge ${card.type==='debit'?'badge-debit':'badge-credit'}">${card.type==='debit'?'체크':'신용'}</span>
        </div>
        <div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:7px">예산 ${won(card.budget)}</div>
        <div class="amounts-row">
          <div><div class="amt-sub">지출</div><div class="amt-val">${won(spent)}</div></div>
          <div style="text-align:right"><div class="amt-sub">잔여</div>
            <div class="amt-val ${net<0?'red':'green'}">${net<0?'초과 '+won(-net):won(net)}</div>
          </div>
        </div>
        ${income>0?`<div style="font-size:0.75rem;color:#10B981;font-weight:700;margin:4px 0 6px">💰 페이백/수입 +${won(income)}</div>`:''}
        <div class="prog-bar"><div class="prog-fill ${cls}" style="width:${pct}%"></div></div>
        <div class="prog-pct">${pct}% 사용</div>
        ${card.type==='credit'&&instAmt>0?`<div class="inst-note">💳 할부 합계 <b>${won(instAmt)}</b> · 일반결제 <b>${won(regAmt)}</b></div>`:''}
      </div>`;
  });
  document.getElementById('page-home').innerHTML = html;
}

function submitExpense() {
  const date   = document.getElementById('fDate').value;
  const cardId = document.getElementById('fCard').value;
  const amount = getAmount('fAmount');
  const desc   = document.getElementById('fDesc').value.trim();
  if (!date || amount<=0 || !desc) { alert('날짜, 금액, 항목명을 입력해주세요.'); return; }
  const ym = date.slice(0, 7);
  const d  = load();
  if (!d.months[ym]) d.months[ym] = { expenses: [], incomes: [] };
  if (!d.months[ym].incomes) d.months[ym].incomes = [];

  if (ENTRY_TYPE === 'income') {
    d.months[ym].incomes.push({ id:uid(), date, cardId, amount, description:desc });
    scheduleSave(d);
    showToast('💰 수입 추가됐어요!');
  } else if (PAY_TYPE === 'inst') {
    const months  = parseInt(document.getElementById('fMonths').value);
    const monthly = Math.ceil(amount / months);
    d.installments.push({ id:uid(), cardId, description:desc, totalAmount:amount, months, monthlyAmount:monthly, startMonth:ym });
    scheduleSave(d);
    showToast(`✅ 할부 등록! 월 ${won(monthly)} × ${months}개월`);
  } else {
    d.months[ym].expenses.push({ id:uid(), date, cardId, amount, description:desc });
    scheduleSave(d);
    showToast('✅ 추가됐어요!');
  }
  document.getElementById('fAmount').value = '';
  document.getElementById('fDesc').value   = '';
  document.getElementById('fAmount').focus();
}

function setHistView(v) {
  HIST_VIEW = v;
  document.getElementById('vList').classList.toggle('on', v==='list');
  document.getElementById('vCal').classList.toggle('on',  v==='cal');
  document.getElementById('listView').style.display = v==='list' ? '' : 'none';
  document.getElementById('calView').style.display  = v==='cal'  ? '' : 'none';
  if (v==='cal') renderCalendar(); else renderHistoryList();
}
function fmtDay(n) {
  if (n===0) return '';
  if (n>=10000) { const v=n/10000; return (Number.isInteger(v)?v:Math.round(v*10)/10)+'만'; }
  if (n>=1000)  { const v=n/1000;  return (Number.isInteger(v)?v:Math.round(v*10)/10)+'천'; }
  return n.toLocaleString();
}
function calLevel(amt) { return amt===0?0:amt<10000?1:amt<50000?2:3; }

function renderCalendar() {
  const d = load(); const ym = ymNow();
  const md = d.months[ym] || { expenses: [], incomes: [] };
  const dayTotals = {};
  (md.expenses || []).forEach(e=>{
    const day = parseInt(e.date.slice(8)); dayTotals[day] = (dayTotals[day]||0) + e.amount;
  });
  const firstDow = new Date(CY,CM-1,1).getDay();
  const lastDate = new Date(CY,CM,0).getDate();
  const today = new Date();
  const isNow = CY===today.getFullYear() && CM===today.getMonth()+1;
  const dows = ['일','월','화','수','목','금','토'];
  let html = dows.map((dw,i)=>`<div class="cal-dow ${i===0?'sun':i===6?'sat':''}">${dw}</div>`).join('');
  for (let i=0;i<firstDow;i++) html += '<div class="cal-day empty"></div>';
  for (let day=1;day<=lastDate;day++) {
    const dow  = (firstDow+day-1)%7;
    const amt  = dayTotals[day]||0;
    const lv   = calLevel(amt);
    const isToday = isNow && today.getDate()===day;
    const nc   = dow===0?'sun':dow===6?'sat':'';
    html += `<div class="cal-day lv${lv} ${isToday?'today':''} ${SEL_DAY===day?'selected':''}" onclick="showDayDetail(${day})">
      <div class="day-num ${nc}">${day}</div>
      ${amt>0?`<div class="day-amt">${fmtDay(amt)}</div><div class="day-sum">합계</div>`:''}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
  if (SEL_DAY) showDayDetail(SEL_DAY,false);
  else document.getElementById('calDetail').innerHTML = '';
}

function showDayDetail(day, rerender=true) {
  SEL_DAY = day; if (rerender) renderCalendar();
  const d = load(); const cm = cardMap();
  const ym = ymNow();
  const md = d.months[ym] || { expenses: [], incomes: [] };
  const dateStr = `${CY}-${pad(CM)}-${pad(day)}`;
  const exps = (md.expenses||[]).filter(e=>e.date===dateStr);
  const incs = (md.incomes||[]).filter(e=>e.date===dateStr);
  const icons = ['🛒','🍜','☕','🚌','👕','💊','📱','🏠','🎮','🍕','⛽','📚','🧴','🎁'];
  if (!exps.length && !incs.length) {
    document.getElementById('calDetail').innerHTML = `<div style="text-align:center;padding:20px 0;color:var(--text-muted);font-size:0.83rem">${CM}월 ${day}일은 내역이 없어요</div>`; return;
  }
  const totalExp = exps.reduce((s,e)=>s+e.amount,0);
  const totalInc = incs.reduce((s,e)=>s+e.amount,0);
  const rows = [
    ...exps.map(e=>({...e,_type:'expense'})),
    ...incs.map(e=>({...e,_type:'income'}))
  ];
  document.getElementById('calDetail').innerHTML = `
    <div class="day-detail-header">
      <span class="day-detail-title">${CM}월 ${day}일</span>
      <span class="day-detail-total">지출 ${won(totalExp)}${totalInc>0?' · 수입 +'+won(totalInc):''}</span>
    </div>
    ${rows.map(e=>{
      const isInc = e._type==='income';
      const icon=icons[e.description.charCodeAt(0)%icons.length];
      const card=cm[e.cardId];
      return `<div class="expense-row${isInc?' income-row':''}">
        <div class="exp-icon" style="${isInc?'background:#D1FAE5':''}">${isInc?'💰':icon}</div>
        <div class="exp-info"><div class="exp-desc">${e.description}${isInc?' <span class="inc-badge">수입</span>':''}</div><div class="exp-meta">${card?card.name:'–'}</div></div>
        <div class="exp-right"><div class="exp-amount${isInc?' inc-amount':''}">${isInc?'+':''}${won(e.amount)}</div></div>
        <button class="edit-exp-btn" onclick="openExpModal('${e.id}')">✏️</button>
        <button class="del-btn" onclick="delEntryFromCal('${e.id}')">×</button>
      </div>`;
    }).join('')}`;
}

function saveExpenseEdit() {
  const id      = document.getElementById('eeId').value;
  const date    = document.getElementById('eeDate').value;
  const cardId  = document.getElementById('eeCard').value;
  const amount  = getAmount('eeAmount');
  const desc    = document.getElementById('eeDesc').value.trim();
  if (!date || amount <= 0 || !desc) { alert('날짜, 금액, 항목명을 입력해주세요.'); return; }
  const d = load();
  const found = findEntryById(id);
  if (!found) return;
  const newYm = date.slice(0, 7);
  const md = d.months[found.ym];
  // 날짜가 바뀌어 월이 달라지면 이동
  if (found.type === 'expense') {
    md.expenses = md.expenses.filter(e => e.id !== id);

    d.months[newYm].expenses.push({ id, date, cardId, amount, description: desc });
  } else {
    md.incomes = md.incomes.filter(e => e.id !== id);

    if (!d.months[newYm].incomes) d.months[newYm].incomes = [];

  scheduleSave(d);

function renderInst() {
  const d=load(); const cm=cardMap(); const cur=CY*12+CM;
  if (!d.installments.length) {
    document.getElementById('instList').innerHTML=`<div class="empty"><div class="emo">💳</div><p>등록된 할부가 없어요</p></div>`; return;
  }
  document.getElementById('instList').innerHTML = d.installments
    .sort((a,b)=>a.startMonth.localeCompare(b.startMonth))
    .map(inst=>{
      const [sy,sm]=inst.startMonth.split('-').map(Number);
      const start=sy*12+sm; const done=cur>=start+inst.months;
      const idx=cur-start; const paid=Math.max(0,Math.min(idx+1,inst.months));
      const pct=Math.round(paid/inst.months*100); const remain=Math.max(0,inst.months-paid);
      const card=cm[inst.cardId];
      return `<div class="inst-card ${done?'inst-status-done':''}">
        <div class="inst-top">
          <div>
            <div class="inst-name">${done?'✅ ':idx>=0?'📌 ':'⏳ '}${inst.description}</div>
            <span class="inst-badge">${card?card.name:'–'}</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
            <div class="inst-monthly">${won(inst.monthlyAmount)}<span>/월</span></div>
            <button class="btn btn-red btn-sm" onclick="delInst('${inst.id}')">삭제</button>
          </div>
        </div>
        <div class="inst-meta">
          <span>총액 ${won(inst.totalAmount)} · ${inst.months}개월</span>
          <span>${done?'완료 ✓':`${paid}회 납부 · ${remain}회 남음`}</span>
        </div>
        <div class="inst-prog-bar"><div class="inst-prog-fill" style="width:${pct}%"></div></div>
        <div style="text-align:right;font-size:0.68rem;color:var(--text-muted);margin-top:3px">${pct}%</div>
      </div>`;
    }).join('');
}

function openInstModal() {
  const d=load(); const credits=d.cards.filter(c=>c.type==='credit');
  if (!credits.length) { alert('신용카드가 없어요.\n설정에서 카드 종류를 신용카드로 변경해주세요.'); return; }
  document.getElementById('iCard').innerHTML=credits.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('iDesc').value=''; document.getElementById('iTotal').value='';
  document.getElementById('iStart').value=ymNow();
  document.getElementById('instModal').classList.add('open');
}
function closeInstModal() { document.getElementById('instModal').classList.remove('open'); }

function submitInst() {
  const cardId=document.getElementById('iCard').value;
  const desc=document.getElementById('iDesc').value.trim();
  const total=getAmount('iTotal'); const months=parseInt(document.getElementById('iMonths').value);
  const start=document.getElementById('iStart').value;
  if (!cardId||!desc||total<=0||!start) { alert('모든 항목을 입력해주세요.'); return; }
  const monthly=Math.ceil(total/months); const d=load();
  d.installments.push({id:uid(),cardId,description:desc,totalAmount:total,months,monthlyAmount:monthly,startMonth:start});
  scheduleSave(d); closeInstModal(); renderInst();
  alert(`✅ 할부 등록!\n월 ${won(monthly)} × ${months}개월`);
}
function delInst(id) {
  if (!confirm('이 할부를 삭제할까요?')) return;
  const d=load(); d.installments=d.installments.filter(i=>i.id!==id); scheduleSave(d); renderInst();
}

const GAS_SCRIPT_CODE = `var SHEET_NAME = 'cashbook';
var SECRET_KEY = 'YOUR_SECRET_KEY'; // ← 본인만 아는 비밀번호로 변경!

function ok(msg)  { return ContentService.createTextOutput(JSON.stringify({ ok: true, msg: msg || '' })).setMimeType(ContentService.MimeType.JSON); }
function fail(msg){ return ContentService.createTextOutput(JSON.stringify({ error: msg || 'error' })).setMimeType(ContentService.MimeType.JSON); }

function doGet(e) {
  if (!e || !e.parameter) return fail('no params');
  if (e.parameter.key !== SECRET_KEY) return fail('unauthorized');

  var action = e.parameter.action || 'read';
  var ss    = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(SHEET_NAME) || ss.insertSheet(SHEET_NAME);

  if (action === 'write') {
    var raw = e.parameter.data;
    if (!raw) return fail('no data');
    sheet.getRange('A1').setValue(raw);
    return ok('saved');
  }

  var val = sheet.getRange('A1').getValue();
  return ContentService
    .createTextOutput(val || '{}')
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) { return fail('use GET'); }`;

// ── GAS 설정 저장
function saveGasSettings() {
  const url = (document.getElementById('gasUrlInput')?.value || '').trim();
  const key = (document.getElementById('gasSecInput')?.value || '').trim();

  if (url && !url.includes('script.google.com')) {
    alert('올바른 Apps Script URL이 아닌 것 같아요.\nhttps://script.google.com/macros/s/…/exec 형식이어야 합니다.'); return;
  }
  if (url && !key) {
    alert('비밀 키를 입력해주세요.\nApps Script 코드의 SECRET_KEY와 동일한 값이어야 합니다.'); return;
  }

  setGasUrl(url);
  if (key) localStorage.setItem(GAS_SEC, key);
  else localStorage.removeItem(GAS_SEC);

  if (url && key) {
    alert('✅ 저장됐어요!\n지금 Google Sheets와 동기화합니다.');
    renderSettings();
    syncLoad(true);
  } else {
    setSyncState('idle');
    renderSettings();
  }
}

function disconnectGas() {
  if (!confirm('Google Sheets 연동을 해제할까요?\n데이터는 이 기기에 남아있습니다.')) return;
  localStorage.removeItem(GAS_KEY);
  localStorage.removeItem(GAS_SEC);
  setSyncState('idle');
  renderSettings();
}

function copyGasCode() {
  navigator.clipboard.writeText(GAS_SCRIPT_CODE).then(() => {
    const btn = document.getElementById('copyBtn');
    if (!btn) return;
    btn.textContent = '✅ 복사됐어요!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 코드 복사'; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {
    // 클립보드 API 실패 시 수동 선택
    const ta = document.createElement('textarea');
    ta.value = GAS_SCRIPT_CODE; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    alert('복사됐어요!');
  });
}

// ── 프리셋 관리
function addPreset() {
  const inp = document.getElementById('newPreset'); const val = inp.value.trim();
  if (!val) return;
  const d = load(); if (d.presets.includes(val)) { alert('이미 있는 항목이에요.'); return; }
  d.presets.push(val); scheduleSave(d); inp.value = ''; renderSettings();
}
function removePreset(idx) {
  const d = load(); d.presets.splice(idx,1); scheduleSave(d); renderSettings();
}

// ── 테마
const THEME_ACCENTS = {
  blue:  {50:'#EFF6FF',100:'#DBEAFE',200:'#BFDBFE',300:'#93C5FD',400:'#60A5FA',500:'#3B82F6',600:'#2563EB'},
  green: {50:'#ECFDF5',100:'#D1FAE5',200:'#A7F3D0',300:'#6EE7B7',400:'#34D399',500:'#10B981',600:'#059669'},
  purple:{50:'#F5F3FF',100:'#EDE9FE',200:'#DDD6FE',300:'#C4B5FD',400:'#A78BFA',500:'#8B5CF6',600:'#7C3AED'},
  rose:  {50:'#FFF1F2',100:'#FFE4E6',200:'#FECDD3',300:'#FDA4AF',400:'#FB7185',500:'#F43F5E',600:'#E11D48'},
};
const THEME_BGS   = {yellow:'#FEFCE8',blue:'#EFF6FF',mint:'#F0FDF4',lavender:'#FAF5FF',white:'#FFFFFF'};
const THEME_FONTS = {
  default:"-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif",
  round:  "Georgia,'Times New Roman',serif",
  mono:   "'Courier New',Courier,monospace",
};

function applyTheme(theme) {
  if (!theme) return;
  const r = document.documentElement.style;
  r.setProperty('--bg', THEME_BGS[theme.bg] || THEME_BGS.yellow);
  const a = THEME_ACCENTS[theme.accent] || THEME_ACCENTS.blue;
  Object.entries(a).forEach(([k,v]) => r.setProperty(`--blue-${k}`, v));
  document.body.style.fontFamily = THEME_FONTS[theme.font] || THEME_FONTS.default;
}
function setThemeBg(k)     { const d=load(); d.theme.bg=k;     scheduleSave(d); applyTheme(d.theme); renderSettings(); }
function setThemeAccent(k) { const d=load(); d.theme.accent=k;  scheduleSave(d); applyTheme(d.theme); renderSettings(); }
function setThemeFont(k)   { const d=load(); d.theme.font=k;    scheduleSave(d); applyTheme(d.theme); renderSettings(); }

// ── 카드 편집
function openEditModal(idx) {
  const d=load(); const c=d.cards[idx];
  document.getElementById('eIdx').value    = idx;
  document.getElementById('eName').value   = c.name;
  document.getElementById('eBudget').value = c.budget.toLocaleString('ko-KR');
  setCardType(c.type);
  document.getElementById('editModal').classList.add('open');
}
function closeEditModal() { document.getElementById('editModal').classList.remove('open'); }
function setCardType(t) {
  EDIT_CARD_TYPE = t;
  document.getElementById('eDebit').classList.toggle('on',  t==='debit');
  document.getElementById('eCredit').classList.toggle('on', t==='credit');
}
function saveCard() {
  const idx=parseInt(document.getElementById('eIdx').value);
  const name=document.getElementById('eName').value.trim(); const budget=getAmount('eBudget');
  if (!name||budget<=0) { alert('이름과 예산을 올바르게 입력해주세요.'); return; }
  const d=load(); d.cards[idx]={...d.cards[idx],name,type:EDIT_CARD_TYPE,budget};
  scheduleSave(d); closeEditModal(); renderSettings(); alert('✅ 저장됐어요!');
}

// ── 데이터 관리
function exportData() {
  const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`cashbook_${ymNow()}.json`; a.click();
}
function resetMonth() {
  if (!confirm(`${CY}년 ${CM}월 지출/수입 내역을 모두 삭제할까요?\n(할부 정보는 유지됩니다)`)) return;
  const d=load(); const ym=ymNow();
  if (d.months[ym]) d.months[ym] = { expenses: [], incomes: [] };
  scheduleSave(d); renderPage(); showToast('✅ 초기화됐어요!');
}

// ══════════════════════════════════════════════════════════
//  ROUTING
// ══════════════════════════════════════════════════════════
function go(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  document.getElementById(`nav-${page}`).classList.add('active');
  PAGE=page; renderPage(); window.scrollTo(0,0);
}
function renderPage() {
  document.getElementById('monthLabel').textContent=`${CY}년 ${CM}월`;
  if (PAGE==='home')     renderHome();
  if (PAGE==='add')      initAdd();
  if (PAGE==='history')  renderHistory();
  if (PAGE==='inst')     renderInst();
  if (PAGE==='settings') renderSettings();
}

// ══════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════
(function init() {
  const d = load();
  applyTheme(d.theme);
  renderPage();
  // GAS 연동 시 앱 시작과 함께 최신 데이터 불러오기
  if (getGasUrl() && getSecretKey()) syncLoad(true);
  else setSyncState('idle');
})();
</script>
